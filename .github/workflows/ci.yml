name: Aantoonbaar checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aantoonbaar_test
          POSTGRES_USER: aantoonbaar
          POSTGRES_PASSWORD: aantoonbaar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aantoonbaar -d aantoonbaar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: npm ci
      - run: python -m pip install -e './services/api[dev]'
      - run: npm run db:setup
      - run: npm run typecheck
      - run: npm test
      - run: python -m ruff check .
        working-directory: services/api
      - run: python -m mypy app
        working-directory: services/api
      - run: python -m pytest
        working-directory: services/api
      - run: alembic upgrade head
        working-directory: services/api
        env:
          AANTOONBAAR_DATABASE_URL: postgresql+psycopg://aantoonbaar:aantoonbaar@127.0.0.1:5432/aantoonbaar_test
      - run: python scripts/export_openapi.py
        working-directory: services/api
      - run: npm run api:generate
      - run: git diff --exit-code -- services/api/openapi.json lib/api/schema.d.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
