services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aantoonbaar
      POSTGRES_USER: aantoonbaar
      POSTGRES_PASSWORD: aantoonbaar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aantoonbaar -d aantoonbaar"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./services/api
    environment:
      AANTOONBAAR_DATABASE_URL: postgresql+psycopg://aantoonbaar:aantoonbaar@db:5432/aantoonbaar
      AANTOONBAAR_ENVIRONMENT: development
      AANTOONBAAR_AUTO_SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    command: sh -c "npm run db:setup && npm run seed && npm run dev -- --hostname 0.0.0.0"
    environment:
      DATABASE_URL: file:/app/data/legacy.db
      PYTHON_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - legacy_data:/app/data
      - uploads_data:/app/storage/uploads

volumes:
  postgres_data:
  legacy_data:
  uploads_data:
